services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    environment:
      - APP_ENV=development
      - DB_HOST=mysql
      - DB_NAME=linuxkonect
      - DB_USER=linuxkonect
      - DB_PASSWORD=${XKHM_DB_PASSWORD:?defina XKHM_DB_PASSWORD no .env (make db-env)}
      - CC_ENCRYPTION_HASH=${CC_ENCRYPTION_HASH:?defina CC_ENCRYPTION_HASH no .env (make db-env)}
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
      - ./storage:/var/www/html/storage
      - ./flutter/xkhm_app/build/web:/var/www/html/public/app:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xkhm-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${XKHM_DB_ROOT_PASSWORD:?defina XKHM_DB_ROOT_PASSWORD no .env (make db-env)}
      - MYSQL_DATABASE=linuxkonect
      - MYSQL_USER=linuxkonect
      - MYSQL_PASSWORD=${XKHM_DB_PASSWORD:?defina XKHM_DB_PASSWORD no .env (make db-env)}
      - MYSQL_INITDB_SKIP_TZINFO=1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - xkhm-network

volumes:
  mysql_data:
    driver: local

networks:
  xkhm-network:
    driver: bridge
