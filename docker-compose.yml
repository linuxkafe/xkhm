version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_NAME=linuxkonect
      - DB_USER=linuxkonect
      - DB_PASSWORD=qm9W8amh5XV9A4Dr
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xkhm-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=linuxkonect
      - MYSQL_USER=linuxkonect
      - MYSQL_PASSWORD=qm9W8amh5XV9A4Dr
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "linuxkonect", "-pqm9W8amh5XV9A4Dr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - xkhm-network

volumes:
  mysql_data:
    driver: local

networks:
  xkhm-network:
    driver: bridge
