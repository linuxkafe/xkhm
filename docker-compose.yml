version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:80"
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_NAME=linuxkonect
      - DB_USER=linuxkonect
      - DB_PASSWORD=qm9W8amh5XV9A4Dr
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
      # The Flutter web build is served from the same origin as the API so
      # the browser manages the session cookie natively (no CORS).
      # Build it first with `make flutter-build`.
      - ./flutter/xkhm_app/build/web:/var/www/html/public/app:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - xkhm-network

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=linuxkonect
      - MYSQL_USER=linuxkonect
      - MYSQL_PASSWORD=qm9W8amh5XV9A4Dr
      # The init script is UTF-8 (pt-BR content). Without this the client
      # charset defaults to latin1 and every accented character is mangled.
      - MYSQL_INITDB_SKIP_TZINFO=1
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "linuxkonect", "-pqm9W8amh5XV9A4Dr"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - xkhm-network

volumes:
  mysql_data:
    driver: local

networks:
  xkhm-network:
    driver: bridge
