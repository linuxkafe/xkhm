<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    # Apache clears the environment by default (`clear_env On`), so the
    # database credentials from the container would never reach PHP. These
    # are what let `configuration.php` use the local password instead of the
    # production one.
    PassEnv DB_HOST
    PassEnv DB_NAME
    PassEnv DB_USER
    PassEnv DB_PASSWORD
    PassEnv APP_ENV

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Security headers
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set X-XSS-Protection "1; mode=block"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    Header set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header unset X-Powered-By

    # The Flutter application is the client area and is served at the root.
    # It compiles a WebAssembly module (CanvasKit) at runtime, which needs
    # 'wasm-unsafe-eval', and it loads its fonts from the local bundle.
    <Location />
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:"
    </Location>

    # The build's assets, mounted at /app.
    <Location /app>
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:"
        DirectoryIndex index.html
    </Location>

    # The admin panel is plain HTML: it keeps the stricter policy.
    <Location /admin>
        Header set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:"
    </Location>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Disable server signature
    ServerSignature Off

    # PHP settings
    php_value upload_max_filesize 10M
    php_value post_max_size 10M
    php_value max_execution_time 30
    php_value memory_limit 128M
</VirtualHost>
