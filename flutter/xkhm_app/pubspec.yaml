name: xkhm_app
description: "LINUXKAFE — área do cliente em Flutter (web + mobile)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # pt-BR Material/Cupertino localisations. Without these the Material
  # widgets throw "No MaterialLocalizations found" and the app cannot render.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP client for the /api/v1 backend.
  http: ^1.2.2

  # State management. Deliberately the smallest option: no code generation,
  # no build_runner, so the build loop stays fast and auditable.
  provider: ^6.1.2

  # Persist the session cookie across app restarts.
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Inter and Poppins are the LINUXKAFE brand fonts (see the design tokens).
  # They are bundled so the application never depends on an external font CDN
  # and works under a strict Content-Security-Policy.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
    # Flutter's web engine always registers "Roboto" as the fallback family.
    # Bundling it avoids a runtime request to the Google Fonts CDN, which the
    # strict Content-Security-Policy would otherwise block.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
